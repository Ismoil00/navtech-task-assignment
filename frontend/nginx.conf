server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # настройки, которые пишутся при старте контейнера, не кешируем
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # файлы сборки с хешем в имени можно кешировать надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # маршруты одностраничного приложения отдают index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
