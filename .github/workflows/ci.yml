name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ручной запуск из вкладки Actions
  workflow_dispatch:

jobs:
  backend:
    name: Backend — линтер и тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_local_password
          POSTGRES_DB: applications
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # остальные настройки берутся из .env.example в корне репозитория
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Линтер
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit- и интеграционные тесты
        run: uv run pytest

  frontend:
    name: Frontend — линтер, типы, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Сквозной сценарий в браузере
    # Долгая задача (сборка образа с Chromium и запуск всего стека), поэтому только
    # для main и ручного запуска; на остальные проверки она не влияет.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Сквозной тест (Playwright)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --build e2e
      - name: Логи сервисов при ошибке
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend frontend
      - name: Отчёт Playwright при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Остановить стек
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
