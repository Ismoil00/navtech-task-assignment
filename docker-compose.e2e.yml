# Сквозной тест в браузере (Playwright). Запуск одной командой:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --build e2e
#
# Браузер теста работает в своём контейнере и открывает приложение по адресу
# host.docker.internal — так фронтенд и API для него на одном хосте, как localhost
# для обычного пользователя (cookie с refresh-токеном работают так же).

services:
  backend:
    environment:
      # стабильная заглушка: случайные отказы шлюза не должны ломать сквозной тест
      PAYMENT_GATEWAY: stable
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://host.docker.internal:3000

  frontend:
    environment:
      FRONTEND_API_URL: http://host.docker.internal:8000/api

  e2e:
    build: ./e2e
    environment:
      E2E_BASE_URL: http://host.docker.internal:3000
    extra_hosts:
      # на Linux имя host.docker.internal нужно объявить явно
      - "host.docker.internal:host-gateway"
    volumes:
      # отчёт и трассировки упавших тестов остаются на диске
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
